name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v2.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            wails_platform: linux/amd64
            artifact: eiksy-linux-amd64
          - platform: windows-amd64
            os: windows-latest
            wails_platform: windows/amd64
            artifact: eiksy-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Wails CLI version
        shell: bash
        run: echo "WAILS_VERSION=$(tr -d '\r\n' < .github/wails-cli-version)" >> "$GITHUB_ENV"

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/wails-cli-version') }}

      - name: Install Wails CLI
        shell: bash
        run: |
          if [ ! -x "$(go env GOPATH)/bin/wails" ]; then
            go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VERSION"
          fi

      - name: Add Go bin directory to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=60
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build release binary
        shell: bash
        run: |
          RELEASE_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            wails build -clean -platform "${{ matrix.wails_platform }}" -tags "webkit2_41 eiksy_debug" -ldflags "-X main.releaseVersion=$RELEASE_VERSION" -o "${{ matrix.artifact }}"
          else
            wails build -clean -platform "${{ matrix.wails_platform }}" -tags eiksy_debug -ldflags "-X main.releaseVersion=$RELEASE_VERSION" -o "${{ matrix.artifact }}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Build CLI binary
        shell: bash
        run: |
          RELEASE_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mkdir -p cli-bin
          CLI_ARTIFACT="eiksy-cli-${{ matrix.platform }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            CLI_ARTIFACT="${CLI_ARTIFACT}.exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.releaseVersion=$RELEASE_VERSION" -o "cli-bin/$CLI_ARTIFACT" ./cmd/eiksy-cli

      - name: Upload CLI release artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiksy-cli-${{ matrix.platform }}
          path: cli-bin/eiksy-cli-${{ matrix.platform }}*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
