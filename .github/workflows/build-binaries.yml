name: Build desktop and CLI binaries

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux desktop and CLI binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Wails CLI version
        shell: bash
        run: echo "WAILS_VERSION=$(tr -d '\r\n' < .github/wails-cli-version)" >> "$GITHUB_ENV"

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/wails-cli-version') }}

      - name: Resolve release version metadata
        shell: bash
        run: echo "RELEASE_VERSION=dev-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        shell: bash
        run: |
          if [ ! -x "$(go env GOPATH)/bin/wails" ]; then
            go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VERSION"
          fi

      - name: Add Go bin directory to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=60
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Linux binary
        shell: bash
        run: wails build -clean -platform linux/amd64 -tags "webkit2_41 eiksy_debug" -ldflags "-X main.releaseVersion=$RELEASE_VERSION" -o eiksy-linux-amd64

      - name: Build CLI binary
        shell: bash
        run: |
          mkdir -p cli-bin
          go build -trimpath -ldflags "-s -w -X main.releaseVersion=$RELEASE_VERSION" -o cli-bin/eiksy-cli-linux-amd64 ./cmd/eiksy-cli

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eiksy-linux-amd64
          path: |
            build/bin/eiksy-linux-amd64
            cli-bin/eiksy-cli-linux-amd64
          if-no-files-found: error
